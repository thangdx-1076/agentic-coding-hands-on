# -----------------------------------------------------------------------
# Release — runs on every push to `main`, publishes without asking
# -----------------------------------------------------------------------
# What it does: reads the version out of `package.json`, tags that commit
# `v<version>`, and PUBLISHES a GitHub release with generated notes. There
# is no human step. The release is public, and watchers are notified, the
# moment a version bump lands on `main`.
#
# ## Why `package.json` is the version, and nothing else
#
# The version already moves in a `chore:` commit during `/tkm:ship`, which
# is where the patch-vs-minor judgment is made with the diff in hand. This
# workflow reads that decision rather than making a second one. Deriving a
# version here from conventional-commit prefixes would mean two independent
# answers to "what version is this", and the day they disagree is the day a
# release is wrong in a way nobody notices until later.
#
# ## Why it is safe to run on EVERY push to main
#
# Most pushes to `main` do not move the version — a docs merge, a revert, a
# second PR landing minutes later. The tag-exists check below makes those
# runs a no-op that exits 0, so this workflow is idempotent by construction
# rather than by luck. Nothing here is conditioned on which files changed;
# the version is the only signal, and a version that has already been
# tagged means there is nothing to release.
#
# ## Why the tag is created explicitly, and not left to the release
#
# `gh release create` would now create the tag itself, since a published
# release does create its tag and a draft does not. It stays its own step
# so the tag-exists check above remains the ONE idempotency gate — a single
# thing to look at when asking "has this version been released", true
# whether or not the release step ever got to run.
#
# The consequence, stated plainly: **the tag survives a failed release
# step.** If the tag lands and the release does not, `v<version>` still
# points at that commit and this workflow will not re-tag it. Create the
# release by hand from the tag, or delete the tag and re-run. And to undo a
# release properly, delete the release AND the tag — deleting either one
# alone leaves this workflow unable to redo it.
#
# ## Why there is no CI check here
#
# Same reasoning as cd.yml: `main` requires the `Quality` and `E2E
# (CI-safe)` checks before a PR can merge, so a commit on `main` has
# already been tested. Re-gating here would wait for a redundant run. And
# the same caveat applies — anything that reaches `main` outside a
# protected PR is tagged with no test in between, and what CI covers is
# less than a green check suggests (`@auth` and `@local-db` are excluded;
# see ci.yml's header). A published release is not a claim that the code
# works — only that `main` moved to a new version.
#
# ## Relationship to cd.yml
#
# Independent, deliberately. cd.yml deploys the same commit; this releases
# it. Neither waits for the other, and that is the price of publishing
# automatically: a release can go public for a commit whose deploy then
# failed. The release describes what is in `main`, not what is live. If the
# two must never diverge, gate this workflow on the deploy — do not put the
# human approval step back, it was removed on purpose.
# -----------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]
  # Re-run after fixing whatever broke the first attempt (a revoked token, a
  # malformed version) without pushing an empty commit. Reads the branch tip
  # at click time, so a manual run after further merges tags the tip rather
  # than the commit that originally failed — check what `main` points at
  # before clicking.
  workflow_dispatch:

concurrency:
  group: release-main
  # Never cancel: a cancelled run can leave the tag created and the release
  # missing, which is the one state this workflow cannot repair on a re-run
  # (the tag-exists check would skip it). Queue instead.
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    permissions:
      # Both the tag ref and the release are writes to repository contents.
      # Nothing else is needed — no packages, no pages, no id-token.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads `version` through `node -p` rather than grep/jq: the field is
      # whatever `require()` resolves it to, which is the same value pnpm and
      # every other tool sees. A malformed or missing version fails here,
      # before anything has been written.
      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version || ''")

          if [ -z "$VERSION" ]; then
            echo "::error::package.json has no \`version\` field. Nothing to release."
            exit 1
          fi

          # Semver core plus an optional pre-release/build suffix. Rejects
          # the shapes that would produce a nonsense tag (`v`, `vlatest`,
          # `v1.2` ) instead of tagging them.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Version \"$VERSION\" is not semver. Fix package.json before releasing."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION → tag v$VERSION"

      # The idempotency gate. `gh api` on a missing ref exits non-zero, so
      # this distinguishes "already released" from "new version" without
      # parsing output.
      - name: Check whether this version is already tagged
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$TAG does not exist yet."
          fi

      # Created through the API, not `git tag && git push`, so the job needs
      # no git identity and no deep checkout — and the tag lands atomically
      # rather than as a second network step that can half-succeed.
      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ steps.version.outputs.tag }}" \
            -f sha="${{ github.sha }}" \
            --silent

          echo "Tagged ${{ github.sha }} as ${{ steps.version.outputs.tag }}"

      # `--generate-notes` builds the body from the PRs and commits since the
      # previous tag, and it goes out exactly as generated — nobody reads it
      # first. PR titles ARE the changelog now; write them accordingly.
      #
      # `--prerelease` when the version carries a semver PRE-RELEASE, because
      # without it a `1.0.0-rc.1` would take the Latest badge off the last
      # stable release. The draft UI used to be where a person ticked that
      # box; with the draft gone the version string has to carry it.
      #
      # The test is anchored to the position semver gives a pre-release —
      # straight after the patch number — and NOT a plain "contains a hyphen".
      # Build metadata is allowed to contain hyphens (`1.0.0+exp-sha.5114f85`
      # is semver.org's own example, and the regex above accepts it), so a
      # `*-*` match would strip the Latest badge off a perfectly stable
      # release and leave no clean way back.
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if printf '%s' "${{ steps.version.outputs.version }}" \
            | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-'; then
            FLAGS+=(--prerelease)
          fi

          URL=$(gh release create "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --title "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            "${FLAGS[@]}")

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Published release: $URL"

      - name: Record what happened
        if: always()
        run: |
          {
            echo "## Release — ${{ job.status }}"
            echo ""
            echo "- Version in \`package.json\`: \`${{ steps.version.outputs.version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            {
              echo "### Skipped — \`${{ steps.version.outputs.tag }}\` already exists"
              echo ""
              echo "This push did not move the version in \`package.json\`, so there is"
              echo "nothing new to release. This is the normal outcome for a docs merge,"
              echo "a revert, or a second PR landing after the one that bumped."
              echo ""
              echo "To release, bump the version on a branch and merge that."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.release.outputs.url }}" ]; then
            {
              echo "### Published"
              echo ""
              echo "**${{ steps.release.outputs.url }}**"
              echo ""
              echo "Tag \`${{ steps.version.outputs.tag }}\` now points at this commit and the"
              echo "release is **live** — it shows on the repository home page and watchers"
              echo "have been notified. Nobody reviewed the generated notes; edit them in"
              echo "place if they read badly."
              echo ""
              echo "This workflow will not re-tag a version it has already tagged. To undo"
              echo "the release, delete the release AND the tag — either one left behind"
              echo "blocks a clean redo."
              echo ""
              echo "A release is not a statement that the code works: it is cut from"
              echo "\`main\` without re-running tests, and the CI that gated the merge"
              echo "excludes \`@auth\` and \`@local-db\` (see ci.yml's header)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Failed before the release was created"
              echo ""
              echo "Check the steps above. If the tag was created but the release was not,"
              echo "a re-run will SKIP — the tag-exists check cannot tell that state apart"
              echo "from an already-released version. Create the release by hand from the"
              echo "existing tag, or delete the tag and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
