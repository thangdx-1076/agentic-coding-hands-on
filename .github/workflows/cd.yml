# -----------------------------------------------------------------------
# Deploy pipeline — production only
# -----------------------------------------------------------------------
# CI (ci.yml) proves the commit. THIS file ships it. Two workflows, not one:
# ci.yml runs on every feature branch and every PR where a deploy would be
# meaningless, and keeping the deploy out of it means a change to the deploy
# path can never turn a PR's test run red.
#
# **The gate is branch protection, not this workflow.** `main` requires the
# `Quality` and `E2E (CI-safe)` checks to pass before a PR can merge, so by
# the time a commit exists on `main` it has already been tested — as a PR,
# against this same suite. That is why the trigger below is a plain
# `push: [main]` and this file contains no CI-conclusion check: re-gating on
# CI here would only wait for a second, redundant run of tests that already
# passed, delaying every deploy by the length of the suite.
#
# The consequence is worth stating plainly: **anything that lands on `main`
# outside a protected PR deploys straight to production.** An admin bypassing
# protection, or a direct push if protection is ever relaxed, reaches users
# with no test in between. Protection is the only thing standing there.
#
# And what that protection is worth is bounded by what CI actually covers,
# which is less than a green check suggests: `@auth` and `@local-db` tests are
# excluded, and the `/auth/callback` PKCE success path has no automated test
# anywhere. Read ci.yml's header before treating a green deploy as "the
# authenticated flow works in production". The smoke check at the end of this
# file is a liveness probe on `/`, not a substitute.
# -----------------------------------------------------------------------
name: CD

on:
  push:
    branches: [main]
  # Manual redeploy: re-ship the current `main` without pushing an empty
  # commit (a rolled-back Vercel alias, a re-run after fixing an env var in
  # the Vercel dashboard). Deploys the branch tip at click time, whatever
  # that is — the person clicking owns that.
  workflow_dispatch:

concurrency:
  group: cd-production
  # NEVER cancel in progress here. A cancelled run can leave `supabase db
  # push` half-applied or a Vercel deployment un-promoted. Queue instead:
  # two deploys back to back is slow, a torn deploy is an outage.
  cancel-in-progress: false

# Every job checks out the default ref for the event — the pushed commit on
# `push`, the branch tip on `workflow_dispatch` — so no explicit `ref:` is
# needed anywhere below.

jobs:
  # Read-only, and deliberately NOT bound to a GitHub Environment. Required
  # reviewers gate an entire job before its first step runs, so a dry-run step
  # living inside `migrate` would produce no output until after the approval —
  # the reviewer would be approving blind. Running it here, one job earlier,
  # is what makes the approval a decision about a printed list of SQL files.
  #
  # The consequence for secrets: this job needs the Supabase credentials while
  # holding no environment, so those three must be REPOSITORY secrets, not
  # environment secrets on `production-db`. That is the price of showing the
  # plan before the gate. See docs/deployment.md § Bước 5.2.
  plan:
    name: List pending migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to the version this repo's migrations were authored and
          # applied with locally. `latest` would make an upstream CLI release
          # an unannounced change to how production schema is applied.
          version: 2.98.2

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Written to the step summary, not just the log: the reviewer should not
      # have to open a job and scroll to decide whether to approve.
      - name: Dry run
        run: |
          {
            echo "## Migrations pending on production"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo ""
            echo "Approve the \`migrate\` job only if this list is what you expect."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  migrate:
    name: Migrate production database
    # Waits for the plan above, so the approval prompt below is never the first
    # thing that happens.
    needs: plan
    runs-on: ubuntu-latest
    # Put a required reviewer on this GitHub Environment. Schema migration is
    # the one irreversible step in this pipeline: `supabase db push` applies
    # every pending file under supabase/migrations/ and there is no undo.
    environment: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # A no-op on any commit that touched no SQL, which is most of them —
      # `db push` compares against the remote `schema_migrations` table and
      # applies only what is missing. Running it unconditionally is cheaper
      # than a path filter that can silently skip a migration when a commit
      # range is computed wrong.
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy:
    name: Deploy to Vercel
    # Schema first, then code. The reverse order opens a window where the new
    # bundle queries columns that do not exist yet — the release that added
    # `kudos_cards.distinct_senders` (migration 0022) would have thrown on
    # every `/kudos` render until its migration landed.
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches ci.yml and the `engines.node` range in package.json
          # (>=22 <25). Vercel's own build image must be set to the same
          # major in Project Settings → Build & Deployment.
          node-version: "24"

      # Pinned, not `vercel@latest`, for the same reason as the Supabase CLI
      # above: an upstream release should never change this pipeline silently.
      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      # Pulls the project's Production environment variables down from Vercel
      # so the build below inlines the real NEXT_PUBLIC_* values. This is why
      # no Supabase credential is duplicated into GitHub secrets: Vercel holds
      # them once, and `vercel pull` is the only thing that reads them.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Build HERE rather than on Vercel, then ship the prebuilt output. The
      # artifact that goes live is then the exact tree this pipeline gated,
      # and a build failure surfaces as a red job in this run instead of
      # inside the Vercel dashboard. Requires Vercel's own Git integration to
      # be OFF for this repo (docs/deployment.md § Bước 4) — otherwise every
      # push to `main` deploys twice, once ungated by Vercel and once here.
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Liveness probe, not a test suite. It catches the failure class that
      # only appears once real env vars are bound: a missing
      # NEXT_PUBLIC_SUPABASE_URL, a proxy redirect loop, a 500 on first
      # render. `--fail` exits non-zero on any 4xx/5xx; the retries absorb the
      # few seconds a fresh deployment needs to start serving.
      #
      # NOTE: with `PRELAUNCH_LOCK_ENABLED=true` and the event still ahead,
      # `/` redirects to `/prelaunch` — `--location` follows it, so a 200 here
      # proves the site is up, not which page a visitor lands on.
      - name: Smoke check
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output /dev/null "${{ steps.deploy.outputs.url }}"

      - name: Record deployment
        if: always()
        run: |
          {
            echo "## Production deploy — ${{ job.status }}"
            echo ""
            echo "- Deployment URL: ${{ steps.deploy.outputs.url }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo ""
            echo "Migrations were applied by the \`migrate\` job before this deploy."
            echo "The CI run that gated it excluded \`@auth\` and \`@local-db\` tests —"
            echo "the authenticated path was NOT verified. See ci.yml's header."
          } >> "$GITHUB_STEP_SUMMARY"
