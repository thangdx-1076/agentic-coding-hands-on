# -----------------------------------------------------------------------
# Deploy pipeline — production only. CODE ONLY, never the database.
# -----------------------------------------------------------------------
# Schema migration lives in migrate.yml and runs ONLY when a person triggers
# it (2026-09-11). Merging to `main` ships code against whatever schema is
# already there.
#
# Read migrate.yml's header before merging anything that adds a migration:
# this split gave up the schema-first ordering that used to be enforced here,
# and the replacement is discipline — make the migration backward compatible,
# or run migrate.yml before you merge. The "Pending migrations" step below
# prints a warning when the commit being deployed touched
# `supabase/migrations/`, but it is a reminder in the run summary, not a gate.
#
# CI (ci.yml) proves the commit. THIS file ships it. Two workflows, not one:
# ci.yml runs on every feature branch and every PR where a deploy would be
# meaningless, and keeping the deploy out of it means a change to the deploy
# path can never turn a PR's test run red.
#
# **The gate is branch protection, not this workflow.** `main` requires the
# `Quality` and `E2E (CI-safe)` checks to pass before a PR can merge, so by
# the time a commit exists on `main` it has already been tested — as a PR,
# against this same suite. That is why the trigger below is a plain
# `push: [main]` and this file contains no CI-conclusion check: re-gating on
# CI here would only wait for a second, redundant run of tests that already
# passed, delaying every deploy by the length of the suite.
#
# The consequence is worth stating plainly: **anything that lands on `main`
# outside a protected PR deploys straight to production.** An admin bypassing
# protection, or a direct push if protection is ever relaxed, reaches users
# with no test in between. Protection is the only thing standing there.
#
# And what that protection is worth is bounded by what CI actually covers,
# which is less than a green check suggests: `@auth` and `@local-db` tests are
# excluded, and the `/auth/callback` PKCE success path has no automated test
# anywhere. Read ci.yml's header before treating a green deploy as "the
# authenticated flow works in production". The smoke check at the end of this
# file is a liveness probe on `/`, not a substitute.
# -----------------------------------------------------------------------
name: CD

on:
  push:
    branches: [main]
  # Manual redeploy: re-ship the current `main` without pushing an empty
  # commit (a rolled-back Vercel alias, a re-run after fixing an env var in
  # the Vercel dashboard). Deploys the branch tip at click time, whatever
  # that is — the person clicking owns that.
  workflow_dispatch:

concurrency:
  group: cd-production
  # NEVER cancel in progress here. A cancelled run can leave a Vercel
  # deployment un-promoted. Queue instead: two deploys back to back is slow,
  # a torn deploy is an outage.
  cancel-in-progress: false

# Every job checks out the default ref for the event — the pushed commit on
# `push`, the branch tip on `workflow_dispatch` — so no explicit `ref:` is
# needed anywhere below.

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Since schema moved to migrate.yml, nothing in this pipeline guarantees
      # the database is ready for the code about to ship. This step does not
      # restore that guarantee — it cannot; it only makes a forgotten
      # migration visible in the run summary instead of in a 500 on /kudos.
      #
      # Reads the compare API rather than deepening the checkout: `git diff`
      # against `event.before` would need fetch-depth 0 on every deploy to
      # answer one yes/no question.
      #
      # Skipped on workflow_dispatch — a manual redeploy has no push range to
      # compare, and `event.before` is empty there.
      - name: Pending migrations check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          # All-zero SHA means a brand-new branch: no previous state to diff.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No push range to compare — skipping."
            exit 0
          fi

          FILES=$(gh api "repos/${{ github.repository }}/compare/$BEFORE...${{ github.sha }}" \
            --jq '[.files[].filename | select(startswith("supabase/migrations/"))] | .[]' || true)

          if [ -z "$FILES" ]; then
            echo "No migration files in this push."
            exit 0
          fi

          {
            echo "## ⚠️ This deploy carries migration files"
            echo ""
            echo "$FILES" | sed 's/^/- `/; s/$/`/'
            echo ""
            echo "This workflow does **not** apply them. If the code being deployed"
            echo "reads the new schema, run **Migrate production database** now —"
            echo "otherwise it queries columns that do not exist yet."
            echo ""
            echo "Already migrated before merging? Then nothing to do."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::This deploy includes migration files that cd.yml does not apply. See the run summary."

      # Must come BEFORE setup-node so the `cache: "pnpm"` below can find the
      # binary. `vercel build` installs dependencies itself, and it picks the
      # package manager from pnpm-lock.yaml plus `packageManager` in
      # package.json — so without pnpm on PATH the build dies on
      # `spawn pnpm ENOENT` before it compiles anything.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # No `version:` input on purpose — see the `quality` job in ci.yml.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches ci.yml and the `engines.node` range in package.json
          # (>=22 <25). Vercel's own build image must be set to the same
          # major in Project Settings → Build & Deployment.
          node-version: "24"
          cache: "pnpm"

      # Pinned, not `vercel@latest`, for the same reason as the Supabase CLI
      # above: an upstream release should never change this pipeline silently.
      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      # Pulls the project's Production environment variables down from Vercel
      # so the build below inlines the real NEXT_PUBLIC_* values. This is why
      # no Supabase credential is duplicated into GitHub secrets: Vercel holds
      # them once, and `vercel pull` is the only thing that reads them.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Build HERE rather than on Vercel, then ship the prebuilt output. The
      # artifact that goes live is then the exact tree this pipeline gated,
      # and a build failure surfaces as a red job in this run instead of
      # inside the Vercel dashboard. Requires Vercel's own Git integration to
      # be OFF for this repo (docs/deployment.md § Bước 4) — otherwise every
      # push to `main` deploys twice, once ungated by Vercel and once here.
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Liveness probe, not a test suite. It catches the failure class that
      # only appears once real env vars are bound: a missing
      # NEXT_PUBLIC_SUPABASE_URL, a proxy redirect loop, a 500 on first
      # render. `--fail` exits non-zero on any 4xx/5xx; the retries absorb the
      # few seconds a fresh deployment needs to start serving.
      #
      # NOTE: with `PRELAUNCH_LOCK_ENABLED=true` and the event still ahead,
      # `/` redirects to `/prelaunch` — `--location` follows it, so a 200 here
      # proves the site is up, not which page a visitor lands on.
      - name: Smoke check
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output /dev/null "${{ steps.deploy.outputs.url }}"

      - name: Record deployment
        if: always()
        run: |
          {
            echo "## Production deploy — ${{ job.status }}"
            echo ""
            echo "- Deployment URL: ${{ steps.deploy.outputs.url }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo ""
            echo "This workflow deployed CODE ONLY. No migration was applied —"
            echo "schema changes run from **Migrate production database**, by hand."
            echo ""
            echo "The CI run that gated this excluded \`@auth\` and \`@local-db\` tests —"
            echo "the authenticated path was NOT verified. See ci.yml's header."
          } >> "$GITHUB_STEP_SUMMARY"
